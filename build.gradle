buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

group = 'cn.kazer'
version = '0.1.38'
archivesBaseName = 'kazer-client-1.8.9-extension'
sourceCompatibility = targetCompatibility = '1.8'
buildDir = '.target/gradle'

minecraft {
    version = '1.8.9-11.15.1.1902-1.8.9'
    mappings = 'stable_22'
    runDir = 'run'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}

configurations { cosmeticImageio }
configurations.compile.extendsFrom(configurations.cosmeticImageio)
dependencies {
    cosmeticImageio 'com.twelvemonkeys.imageio:imageio-webp:3.15.2'
    compile 'org.projectlombok:lombok:1.18.30'
    compile 'org.java-websocket:Java-WebSocket:1.4.1'
    compile 'javazoom:jlayer:1.0.1'
    testCompile 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    workingDir = file("$buildDir/test-work")
    systemProperty 'basedir', projectDir.absolutePath
    doFirst { workingDir.mkdirs() }
}

jar {
    from { configurations.cosmeticImageio.collect { zipTree(it) } } {
        include 'com/twelvemonkeys/**'
    }
    manifest {
        attributes 'FMLCorePlugin': 'cn.kazer.client189.animation.KazerCorePlugin',
                'FMLCorePluginContainsFMLMod': 'true'
    }
}
